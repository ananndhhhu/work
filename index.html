<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .login-box {
        background: #fff;
        padding: 30px;
        border: 1px solid #ddd;
        width: 300px;
        text-align: center;
    }
    .login-box h2 {
        margin-bottom: 20px;
    }
    .login-box input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .login-box button {
        width: 100%;
        padding: 10px;
        background: #3897f0;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .login-box button:hover {
        background: #2c80d3;
    }
    .login-box a {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        color: #3897f0;
        text-decoration: none;
    }
</style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>
    <form>
        <input type="text" placeholder="Username or Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Log In</button>
    </form>
    <a href="#">Forgot password?</a>
</div>

</body>
</html>
