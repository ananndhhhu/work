<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fafafa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 100%;
    max-width: 350px;
    background: #fff;
    border: 1px solid #dbdbdb;
    padding: 30px;
    text-align: center;
}

.logo {
    font-family: 'Billabong', cursive;
    font-size: 40px;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border: 1px solid #dbdbdb;
    border-radius: 5px;
    background: #fafafa;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    background-color: #0095f6;
    border: none;
    color: white;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #0077cc;
}

.divider {
    margin: 15px 0;
    color: #8e8e8e;
    font-size: 14px;
}

.footer {
    margin-top: 20px;
    font-size: 14px;
}

a {
    color: #0095f6;
    text-decoration: none;
    font-weight: bold;
}


img{

    height: 100px;
    width: 100px;
}
</style>

</head>
<body>

<div class="container">
    <div class="logo"><img src="insta_logo.png"></div>

    <form>
        <input type="text" placeholder="Phone number, username, or email">
        <input type="password" placeholder="Password">
        <button type="submit">Log In</button>
    </form>

    <div class="divider">OR</div>

    <div class="footer">
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
</div>

</body>
</html>
